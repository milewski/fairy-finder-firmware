name: Publish firmware assets

on:
  push:
    tags:
      - firmware-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing firmware-vVERSION tag to publish or promote
        type: string
        required: true
      promote:
        description: Promote an already published test OTA after explicit device acceptance
        type: boolean
        default: false

permissions:
  contents: read

# Stable feed changes and promotions serialize across tags as well as reruns.
concurrency:
  group: firmware-public-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'milewski/fairy-finder-firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PROMOTE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.promote && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify public release files and channel
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          manifest = json.loads(Path("firmware.json").read_text())
          version = manifest["version"]
          if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version, re.ASCII) is None:
              raise SystemExit("Expected a stable version")
          tag = f"firmware-v{version}"
          image = Path("fairy-finder.bin").read_bytes()
          expected_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/fairy-finder.bin"
          if (os.environ["RELEASE_TAG"] != tag or manifest["schema"] != 1
              or manifest["board"] != "waveshare-esp32-s3-zero"
              or manifest["url"] != expected_url
              or manifest["size"] != len(image) or not 288 <= len(image) <= 0x1f0000
              or hashlib.sha256(image).hexdigest() != manifest["sha256"]):
              raise SystemExit("Release metadata or binary integrity mismatch")
          marker = Path("release-channel.txt")
          channel = marker.read_text(encoding="ascii").strip() if marker.exists() else "stable"
          if channel not in ("stable", "test"):
              raise SystemExit("Release channel must be stable or test")
          if os.environ["PROMOTE_TEST"] == "true" and channel != "test":
              raise SystemExit("Only an explicitly marked test release can be promoted")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"RELEASE_CHANNEL={channel}\n")
          PYTHON

      - name: Publish release in its declared channel
        if: env.PROMOTE_TEST != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$RELEASE_CHANNEL" = test; then
            gh release create "$RELEASE_TAG" firmware.json fairy-finder.bin \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Fairy Finder test $RELEASE_TAG" \
              --notes "Spare-device test OTA. Manually upload the complete app-only fairy-finder.bin and confirm on the device. The normal update feed stays on the last stable release until explicit promotion." \
              --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" firmware.json fairy-finder.bin \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Fairy Finder $RELEASE_TAG" \
              --notes "App-only firmware and verified update manifest for Waveshare ESP32-S3-Zero." --latest
          fi

      - name: Require the published test assets before promotion
        if: env.PROMOTE_TEST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/promotion-release.json"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "promotion-release.json").read_text())
          if release.get("tag_name") != os.environ["RELEASE_TAG"] or release.get("draft") is not False:
              raise SystemExit("Promotion requires an already published matching test release")
          if {asset["name"] for asset in release.get("assets", [])} != {"firmware.json", "fairy-finder.bin"}:
              raise SystemExit("Expected the exact two app-only release assets")
          PYTHON
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern firmware.json --pattern fairy-finder.bin --dir "$RUNNER_TEMP/promotion-assets"
          cmp firmware.json "$RUNNER_TEMP/promotion-assets/firmware.json"
          cmp fairy-finder.bin "$RUNNER_TEMP/promotion-assets/fairy-finder.bin"

      - name: Check out stable feed for explicit promotion
        if: env.PROMOTE_TEST == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          path: stable-feed
          persist-credentials: true

      - name: Promote the verified tag to the stable raw feed
        if: env.PROMOTE_TEST == 'true'
        working-directory: stable-feed
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import re
          import shutil

          incoming = json.loads(Path("../firmware.json").read_text())
          current = json.loads(Path("firmware.json").read_text())
          def numeric_version(manifest):
              version = manifest.get("version", "")
              if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version, re.ASCII) is None:
                  raise SystemExit("Stable feed has an invalid version")
              return tuple(map(int, version.split(".")))
          if numeric_version(incoming) < numeric_version(current):
              raise SystemExit("Refusing to replace a newer stable release")
          if numeric_version(incoming) == numeric_version(current):
              if any(Path(name).read_bytes() != Path("..", name).read_bytes() for name in ("firmware.json", "fairy-finder.bin")):
                  raise SystemExit("Equal stable versions must have identical immutable assets")
          else:
              for name in ("firmware.json", "fairy-finder.bin"):
                  shutil.copyfile(Path("..", name), Path(name))
          Path("release-channel.txt").write_text("stable\n", encoding="ascii")
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firmware.json fairy-finder.bin release-channel.txt
          if ! git diff --cached --quiet; then
            git commit -m "Promote $RELEASE_TAG after device acceptance"
            git push origin HEAD:main
          fi

      - name: Mark the explicitly promoted release stable and latest
        if: env.PROMOTE_TEST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease=false --latest --title "Fairy Finder $RELEASE_TAG"
